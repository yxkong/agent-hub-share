# Redis configuration template for ops-bootstrap.
# Render profile values before applying. Keep credentials in project-private files.

bind {{redis_bind|127.0.0.1}}
protected-mode yes
port {{redis_port|6379}}
tcp-backlog {{redis_tcp_backlog|511}}
timeout 0
tcp-keepalive 300

daemonize no
supervised systemd
pidfile /run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log

databases {{redis_databases|16}}
always-show-logo no

dir {{redis_data_dir|/var/lib/redis}}
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

appendonly {{redis_appendonly|yes}}
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

maxmemory {{redis_maxmemory|256mb}}
maxmemory-policy {{redis_maxmemory_policy|allkeys-lru}}

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Do not place real secrets in share templates.
# Use project-side ACL/users or requirepass injection during render/apply.
# requirepass {{redis_password_from_project_secret}}
